package:
  name: string-parsers
  description: A parsing library for parsing strings.
  publish:
    version: 8.0.1
    license: MIT
    location:
      githubOwner: purescript-contrib
      githubRepo: purescript-string-parsers
  dependencies:
    - arrays: ">=7.0.0 <8.0.0"
    - control: ">=6.0.0 <7.0.0"
    - either: ">=6.0.0 <7.0.0"
    - enums: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - nonempty: ">=7.0.0 <8.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - strings: ">=6.0.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    dependencies:
      - assert
      - console
      - effect
      - minibench
      - partial
      - transformers
      - unfoldable
workspace:
  packageSet:
    registry: 81.4.0
